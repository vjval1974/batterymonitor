; PlatformIO Project Configuration File
;
; Build:        pio run
; Upload:       pio run -t upload
; Monitor:      pio device monitor
; Test (host):  pio test -e native
; Lint:         pio check
; Clean:        pio run -t clean

[platformio]
default_envs = mega
src_dir = src
include_dir = include
test_dir = test

; -----------------------------------------------------------------------------
; Shared options
; -----------------------------------------------------------------------------
[common]
build_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Wshadow
    -Wno-unused-parameter
    -ffunction-sections
    -fdata-sections
    -DFW_VERSION=\"0.2.0\"

lib_deps_arduino =
    ivanseidel/Thread@^2.1.1
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit RGB LCD Shield Library@^1.0.1
    arduino-libraries/SD@^1.2.4

; -----------------------------------------------------------------------------
; Target: Arduino Mega 2560 (production firmware)
; -----------------------------------------------------------------------------
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
upload_speed = 115200
build_flags =
    ${common.build_flags}
    -DTARGET_AVR
lib_deps = ${common.lib_deps_arduino}
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem
check_skip_packages = yes

; -----------------------------------------------------------------------------
; Target: host machine (pure-math unit tests, no Arduino deps)
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -DTARGET_NATIVE
    -std=gnu++17
build_src_filter = -<*>
