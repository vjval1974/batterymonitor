name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build firmware (Arduino Mega 2560)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e mega

      - name: Report binary size
        run: pio run -e mega -t size || true

  unit-tests:
    name: Unit tests (host / native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-native-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native -v

  host-math-quickcheck:
    name: Host math quickcheck (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile + run quickcheck
        run: |
          g++ -std=gnu++17 -O2 -Wall -Wextra -Iinclude test/host_quickcheck.cpp -o /tmp/quickcheck
          /tmp/quickcheck

  simulator-port:
    name: Simulator JS port + standalone bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cross-check simulator math against firmware
        run: node sim/test_firmware.mjs

      - name: Rebuild the standalone bundle and verify it parses
        run: |
          python3 sim/build_standalone.py
          node --check sim/firmware.js
          node --check sim/sim.js
          # Smoke-check the bundle was emitted with non-trivial size.
          test "$(wc -c < sim/standalone.html)" -gt 20000

  lint:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --suppress=missingIncludeSystem \
                   --inline-suppr \
                   --error-exitcode=1 \
                   -Iinclude src include
